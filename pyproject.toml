[project]
name = "study-assistant"
version = "0.2.0"
description = "Ассистент по учебным материалам: агент на LangGraph поверх гибридного RAG с цитатами на файл и страницу"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4",
    "qdrant-client>=1.15",
    "sentence-transformers>=3.0",
    "fastembed>=0.9",
    "pymupdf>=1.24",
    "openai>=1.40",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "fastapi>=0.140",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
# интерфейсу не нужны модели и torch — он ходит в API по HTTP
ui = [
    "streamlit>=1.40",
    "httpx>=0.27",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "streamlit>=1.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: тянет настоящие модели с Hugging Face",
]
filterwarnings = [
    # тесты гоняют Qdrant в памяти, там индексы payload не нужны
    "ignore:Payload indexes have no effect in the local Qdrant",
]
